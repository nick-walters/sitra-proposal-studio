name: Update CLAUDE_CONTEXT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-context
  cancel-in-progress: false

jobs:
  update-context:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build CLAUDE_CONTEXT.md
        run: node scripts/build-context.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet CLAUDE_CONTEXT.md; then
            echo "No changes — skipping commit."
          else
            git add CLAUDE_CONTEXT.md
            git commit -m "chore: update CLAUDE_CONTEXT.md [skip ci]"
            git push
          fi
