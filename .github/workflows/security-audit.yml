name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 05:00 UTC — catches newly-disclosed advisories on existing locked deps
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (high & critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Runs against the committed lockfile and fails the job on any high or
      # critical advisory (direct or transitive), EXCEPT advisories explicitly
      # allowlisted with a documented reason in audit-ci.jsonc.
      # New/unassessed vulnerabilities still fail the build.
      - name: Run audit (high & critical, with documented allowlist)
        run: npx --yes audit-ci@^7 --config ./audit-ci.jsonc
